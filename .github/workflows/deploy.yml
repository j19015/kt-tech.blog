name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notion-update]

# デプロイ先は Cloudflare（API トークンは secrets）で、GitHub には何も書き込まない
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      # 読了時間と「本文が変わった日時」を Notion のプロパティに書き戻す（#498 / #458）。
      # 前回から編集された記事だけ本文を読む。失敗してもデプロイは止めない
      # （その記事の読了時間が出ない・更新日が last_edited_time になるだけ）
      #
      # 書き込みは専用のインテグレーション（NOTION_SYNC_API_KEY）で行う（#572）。
      # 本番やビルドが使う NOTION_API_KEY は読み取り専用にしておき、漏れても記事を
      # 書き換えられないようにする。NOTION_SYNC_API_KEY が未設定の間だけ従来のトークンを使う
      - name: Sync article metadata to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_SYNC_API_KEY || secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-article-meta.mjs
        timeout-minutes: 10
        continue-on-error: true

      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          # 「参考になった」の Turnstile。未設定ならボタンが出ないだけで、ビルドは通る
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=kt-tech-blog --commit-dirty=true --commit-message="deploy ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge CDN cache
        # secrets は run に直接埋めず env で渡す（シェルのスクリプトに値が展開されないように）
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'
          sleep 5
        continue-on-error: true

      - name: Warm CDN cache
        env:
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          SITE="https://kt-tech.blog"
          for path in "/" "/blogs/page/1" "/about"; do
            curl -s -o /dev/null -w "WARM %{http_code} %{time_starttransfer}s $path\n" "${SITE}${path}" || true
          done
          SLUGS=$(curl -s -X POST "https://api.notion.com/v1/databases/${NOTION_DATABASE_ID}/query" \
            -H "Authorization: Bearer ${NOTION_API_KEY}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"filter":{"property":"Status","select":{"equals":"Published"}},"page_size":100}' \
            | node -e "
              const d=require('fs').readFileSync('/dev/stdin','utf8');
              const j=JSON.parse(d);
              j.results.forEach(p=>{
                const slug=p.properties.Slug?.rich_text?.[0]?.plain_text || p.id.replace(/-/g,'');
                console.log(slug);
              });
            ")
          for slug in $SLUGS; do
            curl -s -o /dev/null -w "WARM %{http_code} %{time_starttransfer}s /blogs/${slug}\n" "${SITE}/blogs/${slug}" || true
            sleep 1
          done
        continue-on-error: true

      - name: Notify search engines
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://kt-tech.blog/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://kt-tech.blog/sitemap.xml" || true
          echo "Pinged Google and Bing"
        continue-on-error: true
